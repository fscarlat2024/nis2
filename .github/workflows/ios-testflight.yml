# Construieste aplicatia iOS "Scut NIS2" pe un Mac din cloud (GitHub) si o urca in TestFlight.
# Pornire: GitHub -> Actions -> "iOS Scut NIS2 TestFlight" -> Run workflow.
# Secrete necesare (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      - Key ID al cheii App Store Connect API (rol Admin)
#   ASC_ISSUER_ID   - Issuer ID (pagina Integrations -> App Store Connect API)
#   ASC_KEY_P8      - continutul fisierului AuthKey_XXXX.p8
#   IOS_DIST_P12_B64, IOS_DIST_P12_PASSWORD - certificatul Apple Distribution permanent (aceleasi ca la NCS/Lengo)
# Erorile xcodebuild sunt raportate si ca adnotari (vizibile in rezumatul rularii).
name: iOS Scut NIS2 TestFlight

on:
  # se porneste manual, dupa ce exista aplicatia in App Store Connect si secretele
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependinte + sincronizare Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Alege Xcode cel mai nou
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Cheie App Store Connect API
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Certificat permanent + profil App Store (prin API, fara dispozitiv)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ro.netcomm.nis2
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          pip3 install --quiet --break-system-packages "pyjwt[crypto]" || pip3 install --quiet "pyjwt[crypto]"
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 ci/signing.py setup

      - name: Arhivare (semnare automata Apple)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > "$RUNNER_TEMP/archive.log" 2>&1 || {
              grep -E "error:|error |Error |failed|requires a provisioning|No Accounts|No profiles" "$RUNNER_TEMP/archive.log" | sort -u | head -n 25 | while IFS= read -r l; do echo "::error title=archive::${l:0:900}"; done
              tail -n 60 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          tail -n 20 "$RUNNER_TEMP/archive.log"

      - name: Export + upload TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || {
              grep -E "error|Error|failed|ITMS-|Invalid" "$RUNNER_TEMP/export.log" | sort -u | head -n 25 | while IFS= read -r l; do echo "::error title=export::${l:0:900}"; done
              tail -n 60 "$RUNNER_TEMP/export.log"
              exit 1
            }
          tail -n 30 "$RUNNER_TEMP/export.log"
          echo "::notice title=upload::Build ${{ github.run_number }} urcat in App Store Connect / TestFlight"

      - name: Sterge keychain-ul temporar + cheia
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ro.netcomm.nis2
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 ci/signing.py cleanup || true
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"
